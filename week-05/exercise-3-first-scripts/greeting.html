<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: write your name here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting</title>
  </head>
  <body>
    <h1>Greeting</h1>
    <script>
      // Ask for a name and a town, then greet the user
      var firstName = prompt("Please enter your name");
      var town = prompt("Please enter your town");
      document.write("Hello, " + firstName + " from " + town);
    </script>
  </body>
</html>
