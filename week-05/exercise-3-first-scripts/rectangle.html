<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: write your name here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle</title>
  </head>
  <body>
    <h1>Rectangle</h1>
    <script>
      /* Keeps the sides of a rectangle in variables,
         then writes its area and its perimeter. */
      var shape = "rectangle";
      var width = 5;
      var height = 3;
      var isSquare = false;
      // The area is the width times the height
      var area = width * height;
      var perimeter = width + width + height + height;
      document.write("Shape: " + shape);
      document.write(", area: ");
      document.write(area);
      document.write(", perimeter: ");
      document.write(perimeter);
      document.write(", square: ");
      document.write(isSquare);
    </script>
  </body>
</html>
