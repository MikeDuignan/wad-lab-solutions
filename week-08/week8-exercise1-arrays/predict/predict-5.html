  <body>
    <h1>Puzzle 5</h1>
    <p id="report">Report to follow.</p>
    <script>
      // A counting loop with a small mistake in its condition
      const report = document.getElementById('report');
      const teams = ['Reds', 'Blues', 'Greens'];
      let line = '';
      for (let i = 0; i <= teams.length; i++) {
        line = line + teams[i] + ' ';
      }
      report.textContent = line;
    </script>
