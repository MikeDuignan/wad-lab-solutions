<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: write your name here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party tickets</title>
  </head>
  <body>
    <h1>Party tickets</h1>
    <label for="adults-input">Adults</label>
    <input type="number" id="adults-input" value="2">
    <label for="children-input">Children</label>
    <input type="number" id="children-input" value="3">
    <button id="count-button">Count the tickets</button>
    <p id="ticket-total">Tickets: 0</p>
    <script>
      const adultsInput = document.getElementById('adults-input');
      const childrenInput = document.getElementById('children-input');
      const countButton = document.getElementById('count-button');
      const ticketTotal = document.getElementById('ticket-total');

      function countTickets() {
        const tickets = Number(adultsInput.value) + Number(childrenInput.value);
        ticketTotal.textContent = 'Tickets: ' + tickets;
      }

      countButton.addEventListener('click', countTickets);
    </script>
  </body>
</html>
