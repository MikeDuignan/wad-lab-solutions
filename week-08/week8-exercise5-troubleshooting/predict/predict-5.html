  <body>
    <h1>Puzzle 5</h1>
    <button id="show-button">Show the message</button>
    <p id="report">Report to follow.</p>
    <script>
      // Click the button. Does anything happen, and what does the Console say?
      const showButton = document.getElementById('show-button');
      const report = document.getElementById('report');

        report.textContent = 'The ferry is on time.';

      showButton.addEventListener('click', showMessage);
    </script>
