<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: write your name here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score check</title>
  </head>
  <body>
    <h1>Score check</h1>
    <button id="score-button">Check the score</button>
    <p id="score-message">No result yet.</p>
    <script>
      const scoreButton = document.getElementById('score-button');
      const scoreMessage = document.getElementById('score-message');
      const score = 62;

      function checkScore() {
        if (score > 50) {
          scoreMessage.textContent = 'Pass';
        } else {
          scoreMessage.textContent = 'Try again';
        }
      }

      scoreButton.addEventListener('click', checkScore);
    </script>
  </body>
</html>
