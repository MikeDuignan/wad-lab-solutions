  <body>
    <h1>Puzzle 3</h1>
    <p id="report">Report to follow.</p>
    <script>
      // Storage holds strings
      const report = document.getElementById('report');
      localStorage.setItem('seats', 5);
      const seats = localStorage.getItem('seats');
      report.textContent = typeof seats + ', ' + (seats + 1) + ', ' + (Number(seats) + 1);
    </script>
