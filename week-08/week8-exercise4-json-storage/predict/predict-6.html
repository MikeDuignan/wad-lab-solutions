  <body>
    <h1>Puzzle 6</h1>
    <p id="report">Report to follow.</p>
    <script>
      // JSON.parse builds an object from text
      const report = document.getElementById('report');
      const text = '{"width":4,"height":"5"}';
      const box = JSON.parse(text);
      report.textContent = (box.width + box.height) + ' and ' + (box.width * box.height);
    </script>
  </body>
