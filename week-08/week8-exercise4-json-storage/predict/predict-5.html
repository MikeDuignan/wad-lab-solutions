  <body>
    <h1>Puzzle 5</h1>
    <p id="report">Report to follow.</p>
    <script>
      // A key that has nothing stored under it
      const report = document.getElementById('report');
      localStorage.removeItem('guest-book');
      const entry = localStorage.getItem('guest-book');
      if (entry !== null) {
        report.textContent = 'Found: ' + entry;
      } else {
        report.textContent = 'Nothing saved, getItem gave ' + entry;
      }
    </script>
  </body>
