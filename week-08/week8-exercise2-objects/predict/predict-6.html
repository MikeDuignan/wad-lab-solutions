  <body>
    <h1>Puzzle 6</h1>
    <p id="report">Report to follow.</p>
    <script>
      // One equals sign changes a property, or makes a new one
      const report = document.getElementById('report');
      const pen = { ink: 'black' };
      const before = pen.cap;
      pen.cap = 'red';
      report.textContent = 'Before: ' + before + '. After: ' + pen.cap + '.';
    </script>
