  <body>
    <h1>Puzzle 4</h1>
    <p id="report">Report to follow.</p>
    <script>
      // A const object can have its properties changed
      const report = document.getElementById('report');
      const room = { number: 12, guests: 2 };
      room.guests = 3;
      room.guests = room.guests + 1;
      report.textContent = 'Room ' + room.number + ' has ' + room.guests + ' guests';
