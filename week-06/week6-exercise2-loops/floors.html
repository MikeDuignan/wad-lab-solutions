<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: write your name here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floors</title>
  </head>
  <body>
    <h1>Lighthouse floors</h1>
    <script>
      // Ask how many floors, then write a line for each floor
      var lastFloor = Number(prompt("How many floors does the lighthouse have?"));
      for (var i = 1; i <= lastFloor; i++) {
        document.write("Floor " + i + "<br>");
      }
    </script>
  </body>
</html>
