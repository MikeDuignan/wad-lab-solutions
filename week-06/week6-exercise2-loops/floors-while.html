<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: write your name here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floors</title>
  </head>
  <body>
    <h1>Lighthouse floors</h1>
    <script>
      // The same floors, written with a while loop
      var lastFloor = Number(prompt("How many floors does the lighthouse have?"));
      var i = 1;
      while (i <= lastFloor) {
        document.write("Floor " + i + "<br>");
        i++;
      }
    </script>
  </body>
</html>
