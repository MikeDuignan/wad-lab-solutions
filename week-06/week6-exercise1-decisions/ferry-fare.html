<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Student name: write your name here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferry fare</title>
  </head>
  <body>
    <h1>Ferry fare</h1>
    <script>
      // Ask for an age, then write the fare for the ferry crossing
      var age = Number(prompt("Please enter your age"));
      if (age < 0 || age > 120) {
        document.write("That is not a valid age");
      } else if (age < 5) {
        document.write("Free");
      } else if (age < 16) {
        document.write("Child fare");
      } else {
        document.write("Adult fare");
      }
    </script>
  </body>
</html>
