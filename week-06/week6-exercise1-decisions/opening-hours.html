<!DOCTYPE html>

    <title>Opening hours</title>
  </head>
  <body>
    <h1>Opening hours</h1>
    <script>
      // The shop is open from 9 until 17 (five o'clock), counted in whole hours
      var hour = 10;
      if (hour < 9 || hour >= 17) {
        document.write("Closed");
      } else {
        document.write("Open");
      }
    </script>
  </body>
</html>
